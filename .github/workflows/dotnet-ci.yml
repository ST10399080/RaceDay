name: RaceDay CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.sln

      - name: Build solution
        run: dotnet build RaceDay.API/RaceDay.API.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.API/RaceDay.API.sln --configuration Release --no-build --logger "console;verbosity=normal"
